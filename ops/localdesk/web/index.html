<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color-scheme:light;--bg:#f6f7fa;--card:#fff;--text:#202a36;--sub:#687584;--line:#e6eaf0;--blue:#286dc4;--bluebg:#ebf2fb;--red:#c44250;--green:#187954;--shadow:0 2px 18px rgba(33,52,78,.035)}
*{box-sizing:border-box}body{background:var(--bg);color:var(--text);margin:0;font-size:14px}

header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:20px}
h1{font-size:27px;letter-spacing:-.05em;font-weight:720;margin:0 0 6px}h2{font-size:21px;letter-spacing:-.025em;font-weight:700;margin:4px 0 6px}h3{font-size:17px;font-weight:700;margin:0}
.sub{font-size:12px;color:var(--sub);line-height:1.65}.short{color:var(--sub);font-size:13px;margin:5px 0 16px}.update{font-size:12px;color:var(--sub)}.pill{display:inline-flex;background:#e6f5ed;color:var(--green);padding:7px 11px;border-radius:50px;font-weight:650;font-size:12px}
.nav{display:flex;gap:5px;padding:4px;border-radius:12px;background:#e9edf2;width:max-content;margin-bottom:24px}.nav button{border:0;border-radius:9px;padding:11px 25px;color:#667586;background:transparent;font-size:14px}.nav button.active{background:white;color:var(--blue);box-shadow:0 2px 8px #00000010}
button{cursor:pointer;font:inherit;font-weight:600;font-size:13px;border-radius:9px;border:1px solid #d4dce6;background:#fff;color:#31435b;padding:10px 13px}button:hover{background:#f3f7fd;border-color:#8dacd8}.primary{background:#286dc4;color:white;border-color:#286dc4}.primary:hover{background:#165aa9;color:white}.muted{font-size:12px;color:var(--sub)}
.page-section{display:none}.page-section.active{display:block}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.panel{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:22px;box-shadow:var(--shadow)}.card{cursor:pointer;transition:box-shadow .14s,border-color .14s}.card:hover{border-color:#a9bfde;box-shadow:0 6px 22px #30508015}.cardhead{display:flex;align-items:center;justify-content:space-between;gap:12px}.kind{background:#f0f3f7;padding:6px 9px;border-radius:30px;font-size:11px;color:var(--sub);white-space:nowrap}.big{font-size:32px;font-weight:750;letter-spacing:-.045em;margin:19px 0 3px;line-height:1.1}.red{color:var(--red)}.green{color:var(--green)}.statrow{display:flex;gap:22px;flex-wrap:wrap;padding-top:16px;margin-top:16px;border-top:1px solid var(--line)}.statrow div{min-width:70px}.statrow strong{font-size:16px;display:block;margin:5px 0}.cardfoot{display:flex;align-items:center;justify-content:space-between;margin-top:18px;font-size:12px;color:var(--blue);font-weight:600}
.notice{background:#eef3f8;border-radius:11px;padding:14px 16px;color:#4f667f;font-size:12px;line-height:1.7;margin:0 0 20px}
.toolrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}.segments{display:flex;gap:5px;flex-wrap:wrap}.segments button{border:0;background:#edf1f5;color:#63758b;font-size:12px;padding:9px 15px}.segments button.active{background:var(--bluebg);color:var(--blue)}
.detail{margin:14px 0 0}.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:18px 0}.metric{background:#f6f8fb;border-radius:10px;padding:13px}.metric span{color:var(--sub);font-size:11px}.metric strong{display:block;font-size:20px;margin:7px 0 0}
table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;background:#f7f9fb;color:#687584;font-size:12px;font-weight:650}th,td{border-bottom:1px solid var(--line);padding:12px 10px}th:not(:first-child),td:not(:first-child){text-align:right}tr:last-child td{border-bottom:0}
.toptext{margin:0 0 18px}.runline{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:17px 0;border-bottom:1px solid var(--line)}.runline:last-child{border-bottom:0}.runname{font-size:16px;font-weight:700}.runbuttons{display:flex;gap:7px;flex-wrap:wrap}.job{background:#f7f9fc;border-radius:10px;padding:13px 14px;margin:9px 0}.jobline{display:flex;gap:10px;align-items:center}.jobtitle{font-weight:660;font-size:13px}.jobmessage{margin-top:5px;color:#5d6d80;font-size:12px;line-height:1.7}.jobstatus{padding:5px 8px;border-radius:30px;font-size:11px;background:#e8eef5;color:#55708a;white-space:nowrap}.jobstatus.succeeded{background:#e5f6ec;color:var(--green)}.jobstatus.failed{background:#ffecee;color:var(--red)}.jobstatus.partial{background:#fff2d9;color:#8d5b1a}
.smalllink{border:0;color:var(--blue);font-size:12px;background:transparent;padding:6px 0}.smalllink:hover{background:transparent;text-decoration:underline}details{margin-top:8px}summary{cursor:pointer;color:var(--sub);font-size:12px}pre{max-height:310px;white-space:pre-wrap;overflow:auto;word-break:break-word;background:#1b2637;color:#d6e4f3;font:11px/1.6 ui-monospace,Menlo,monospace;padding:14px;border-radius:9px}
.settingscard{background:white;border:1px solid var(--line);border-radius:13px;padding:20px;margin-bottom:12px}.settingshead{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:14px}.controls{display:flex;align-items:center;gap:13px;flex-wrap:wrap}.control{display:flex;flex-direction:column;gap:6px;flex:1;min-width:150px}.control label{font-size:11px;color:var(--sub)}.control input,.control select,select.credsel,input.secret{width:100%;background:#fff;border:1px solid #cfd9e6;border-radius:9px;padding:10px;color:var(--text);font:inherit;font-size:13px;min-width:0}.control input:focus,.control select:focus{outline:2px solid #b9d5f6}
.check{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}.check input{width:17px;height:17px;accent-color:var(--blue)}.settingfoot{display:flex;align-items:center;gap:15px;flex-wrap:wrap;margin-top:15px}.settingfoot button{margin-left:auto}
.credential{background:white;padding:19px;border:1px solid var(--line);border-radius:13px;margin-top:16px}.credline{display:flex;justify-content:space-between;padding:8px 0;font-size:13px;gap:8px}.credline span{color:var(--sub)}.credfields{display:grid;grid-template-columns:1fr 1.2fr auto;gap:9px;margin:13px 0}.hint{border-left:3px solid #98b4d2;padding-left:12px;margin-top:14px;color:#5b6e80;font-size:12px;line-height:1.8}
footer{margin-top:29px;font-size:11px;color:#96a1ad;line-height:1.7}#toast{display:none;position:fixed;bottom:24px;right:24px;background:#24384c;color:white;padding:13px 18px;max-width:420px;font-size:13px;border-radius:11px;box-shadow:0 8px 36px #0002;z-index:30}#toast.error{background:#a73b4c}
@media(max-width:760px){.page{padding:20px 13px}.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.runline{align-items:flex-start;flex-direction:column}.credfields{grid-template-columns:1fr}h1{font-size:22px}}

<body><div class="page">
<header><h1>量化亚洲盘</h1><nav class="nav"><button id="tab-scores" class="active" onclick="tab('scores')">战绩</button><button id="tab-runs" onclick="tab('runs')">运行</button><button id="tab-settings" onclick="tab('settings')">设置</button><button class="nav-refresh" aria-label="刷新数据" title="刷新" onclick="refresh(true)">↻</button></nav></header>

</section>

  <div class="connect-card" data-connection="api">

    <input class="connect-input" data-secret="MR1_TG_CHAT_ID" type="text" autocomplete="off" placeholder="接收位置 Chat ID">
    <div class="connect-actions"><button class="find-chat" onclick="findChats('mr1')">找接收位置</button><button onclick="saveConnections('mr1')">保存</button></div><div class="chat-results" data-chat-results="mr1"></div>
  </div>

    <div class="connect-actions"><button class="find-chat" onclick="findChats('research')">找接收位置</button><button onclick="saveConnections('research')">保存</button></div><div class="chat-results" data-chat-results="research"></div>
  </div>
</div>

</details>

<script>
var data=null,selected="m1",period="all",currentTab="scores";
var modelNames={m1:"M1 AH",mr1:"MR1 AH",m3:"M3",m4:"M4"};
function esc(x){return String(x==null?"":x).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function n(x,places){return x==null?"—":Number(x).toLocaleString("zh-CN",{minimumFractionDigits:places||0,maximumFractionDigits:places||0})}
function u(x){return x==null?"—":(Number(x)>0?"+":"")+n(x,3)+" U"}
function pct(x){return x==null?"—":(Number(x)>0?"+":"")+n(x,2)+"%"}
function col(x){return Number(x)<0?"red":"green"}
function date(x){return x?new Date(x).toLocaleString("zh-CN",{timeZone:"Asia/Shanghai",hour12:false}):"暂无"}
function el(id){return document.getElementById(id)}
function html(parts){return parts.join("")}
function toast(message,bad){var box=el("toast");box.textContent=message;box.className=bad?"error":"";box.style.display="block";clearTimeout(window.toastId);window.toastId=setTimeout(function(){box.style.display="none"},4300)}
function tab(id){currentTab=id;["scores","runs","settings"].forEach(function(x){el("section-"+x).classList.toggle("active",x===id);el("tab-"+x).classList.toggle("active",x===id)});if(id==="scores")renderScores();if(id==="runs")renderRuns();if(id==="settings")renderSettings()}
function score(id){if(id==="m1"||id==="mr1")return data.performance[id][period];if(id==="m3"){var a=data.performance.m3.lines;var pnl=a.reduce(function(sum,x){return sum+Number(x.pnl)},0);return {pnl:pnl,settled:a.reduce(function(sum,x){return sum+x.settled},0),sent:a.reduce(function(sum,x){return sum+x.sent},0),pending:a.reduce(function(sum,x){return sum+x.pending},0),roi:null}};var x=data.performance.m4.hypothetical||{};return {pnl:x.pnl_units,settled:x.orders,sent:x.orders,pending:0,roi:x.roi==null?null:x.roi*100}}
function cards(){return ["m1","mr1","m3","m4"].map(function(id){var x=score(id),label=id==="m4"?"历史研究对比":id==="m3"?"影子模拟":"正式 TG 战绩";return '<div class="panel card" onclick="selectScore(\''+id+'\')"><div class="cardhead"><h3>'+modelNames[id]+'</h3><span class="kind">'+label+'</span></div><div class="big '+col(x.pnl)+'">'+u(x.pnl)+'</div><div class="sub">已结收益　·　收益率 '+pct(x.roi==null&&id==="m3"?(x.settled?x.pnl/x.settled*100:null):x.roi)+'</div><div class="statrow"><div><span class="sub">'+(id==="m4"?"比较样本":"已发 / 模拟")+'</span><strong>'+n(x.sent)+'</strong></div><div><span class="sub">已结算</span><strong>'+n(x.settled)+'</strong></div><div><span class="sub">未结算</span><strong>'+n(x.pending)+'</strong></div></div><div class="sub" style="margin-top:13px">数据截至：'+date(id==="m3"?data.performance.m3.source:id==="m4"?data.performance.m4.source:data.metrics[id].source_time)+'</div><div class="cardfoot"><span>'+ (id==="m4"?"查看研究比较":id==="m3"?"看六条模型成绩":"查看详细胜负") +'</span><span>查看 ›</span></div></div>'}).join("")}
function selectScore(id){selected=id;renderScores();el("details").scrollIntoView({behavior:"smooth",block:"nearest"})}
function statbox(label,v,cls){return '<div class="metric"><span>'+label+'</span><strong class="'+(cls||"")+'">'+v+'</strong></div>'}
function detail(){var id=selected,p=data.performance,items=[],title=modelNames[id],desc;
if(id==="m1"||id==="mr1"){var w=p[id][period],periodNames={all:"历史累计",last:"上周（"+p.label.last+"）",this:"本周（"+p.label.this+"）"};
items.push('<div class="toolrow"><div><h3>'+title+' · 详细战绩</h3><p class="sub">只统计真正发送到 Telegram 的正式订单；按发单日期划分周战绩。</p></div><div class="segments">'+["all","last","this"].map(function(k){return '<button class="'+(period===k?"active":"")+'" onclick="changePeriod(\''+k+'\')">'+(k==="all"?"全部":k==="last"?"上周":"本周")+'</button>'}).join("")+'</div></div>');
items.push('<p class="sub">'+periodNames[period]+'</p><div class="metrics">'+statbox("净收益",u(w.pnl),col(w.pnl))+statbox("ROI",pct(w.roi),col(w.roi))+statbox("已发订单",n(w.sent))+statbox("已结算",n(w.settled))+statbox("未结算",n(w.pending))+'</div>');
items.push('<table><thead><tr><th>全赢</th><th>半赢</th><th>走水</th><th>半输</th><th>全输</th></tr></thead><tbody><tr>'+["全赢","半赢","走水","半输","全输"].map(function(k){return '<td>'+n(w.states[k])+'</td>'}).join("")+'</tr></tbody></table>');
} else if(id==="m3"){items.push('<h3>M3 · 六条模型影子成绩</h3><p class="short">按同场、同模型、同盘口只计一笔；这是模拟收益，不是正式 TG 战绩。</p>');
items.push('<table><thead><tr><th>模型</th><th>盘口</th><th>模拟单</th><th>已结</th><th>未结</th><th>净收益</th><th>收益率</th></tr></thead><tbody>');
items.push(p.m3.lines.map(function(x){return '<tr><td>'+esc(x.name)+'</td><td>'+x.market+'</td><td>'+n(x.sent)+'</td><td>'+n(x.settled)+'</td><td>'+n(x.pending)+'</td><td class="'+col(x.pnl)+'">'+u(x.pnl)+'</td><td class="'+col(x.roi)+'">'+pct(x.roi)+'</td></tr>'}).join(""));
items.push('</tbody></table><p class="sub">数据截至 '+date(p.m3.source)+'。三套模型会对同一场比赛分别模拟，不能当成独立的比赛数量。</p>');
} else {var a=p.m4,b=a.baseline||{},x=a.excluded||{},h=a.hypothetical||{};items.push('<h3>M4 · 联赛优化研究</h3><p class="short">M4 目前只是拿 MR1 的已结算订单做历史比较，还没有独立正式 TG 战绩。</p>');
items.push('<table><thead><tr><th>研究方案</th><th>订单</th><th>净收益</th><th>收益率</th></tr></thead><tbody>');
items.push('<tr><td>原 MR1</td><td>'+n(b.orders)+'</td><td>'+u(b.pnl_units)+'</td><td>'+pct(b.roi==null?null:b.roi*100)+'</td></tr>');
items.push('<tr><td>研究中被剔除的联赛订单</td><td>'+n(x.orders)+'</td><td>'+u(x.pnl_units)+'</td><td>'+pct(x.roi==null?null:x.roi*100)+'</td></tr>');
items.push('<tr><td>假如历史上跳过这两联赛</td><td>'+n(h.orders)+'</td><td class="'+col(h.pnl_units)+'">'+u(h.pnl_units)+'</td><td>'+pct(h.roi==null?null:h.roi*100)+'</td></tr></tbody></table>');
items.push('<p class="sub">目前研究对象：土耳其超级联赛、日本 J1。这个对比是事后分析，不代表策略已经改变或未来能够获得相同收益。</p>')}
return html(items)}
function changePeriod(k){period=k;renderScores()}
function renderScores(){if(!data)return;el("cards").innerHTML=cards();el("details").innerHTML=detail();var t=[data.metrics.m1.source_time,data.metrics.mr1.source_time,data.performance.m3.source].filter(Boolean).sort().pop();el("scoreUpdate").textContent="来源：各模型本机正式或研究账本 · 最后报表 "+date(t)}
function runLines(){return ["m1","mr1","m3","m4"].map(function(id){return '<div class="runline"><div><div class="runname">'+modelNames[id]+'</div><div class="sub">'+(id==="m1"?"正式让球模型":id==="mr1"?"跨市场让球模型":id==="m3"?"三模型影子预测": "联赛优化研究")+'</div></div><div class="runbuttons"><button class="primary" onclick="runModel(\''+id+'\',\'run\')">'+(id==="m4"?"运行研究":"运行一次")+'</button>'+(id==="m4"?'':'<button onclick="runModel(\''+id+'\',\'settle\')">结算赛果</button>')+'<button onclick="goScore(\''+id+'\')">看战绩</button></div></div>'}).join("")}
function goScore(id){selected=id;tab("scores");el("details").scrollIntoView({behavior:"smooth",block:"nearest"})}
function renderRuns(){if(!data)return;el("runModels").innerHTML=runLines();el("runJobs").innerHTML=data.jobs.length?data.jobs.slice(0,9).map(function(j){var state={succeeded:"已完成",failed:"未成功",running:"运行中",partial:"部分完成"}[j.status]||"已中断";return '<div class="job"><div class="jobline"><span class="jobstatus '+esc(j.status)+'">'+state+'</span><div><div class="jobtitle">'+modelNames[j.model]+' · '+({run:"运行",settle:"结算赛果",report:"查看报表",sync:"更新代码",test:"测试"}[j.action]||"任务")+'</div><div class="sub">'+date(j.started_at)+'</div></div></div><div class="jobmessage">'+esc(j.message|| (j.status==="running"?"正在执行，请稍后刷新。":j.status==="failed"?"运行没有成功，可打开技术详情。":"任务已结束。"))+'</div><details><summary>技术详情（遇到问题时查看）</summary><div id="raw-'+esc(j.id)+'"></div><button class="smalllink" onclick="loadLog(\''+esc(j.id)+'\')">读取原始记录</button></details></div>'}).join(""):'<p class="sub">还没有本机执行记录。</p>'}
function control(id){var c=data.settings.models[id],isResearch=id==="m3"||id==="m4",tg=isResearch?"推送研究结果到 TG":"正式订单发到 TG";
return '<div class="settingscard" data-model="'+id+'"><div class="settingshead"><div><h3>'+modelNames[id]+'</h3><p class="sub">'+(isResearch?(id==="m3"?"发送该次新预测，保持研究身份。":"发送研究比较，目前没有独立赛前下注信号。"):"保留原正式 TG 账本与发单程序。")+'</p></div><button onclick="saveModel(\''+id+'\')">保存</button></div><div class="controls"><label class="check"><input data-k="schedule_enabled" type="checkbox" '+(c.schedule_enabled?"checked":"")+'>自动运行</label><div class="control"><label>运行方式</label><select data-k="schedule_type" onchange="scheduleFields(\''+id+'\')"><option value="manual" '+(c.schedule_type==="manual"?"selected":"")+'>只手动</option><option value="times" '+(c.schedule_type==="times"?"selected":"")+'>指定时间</option><option value="interval" '+(c.schedule_type==="interval"?"selected":"")+'>循环间隔</option></select></div><div class="control" data-time="'+id+'"><label>每天运行（北京时间）</label><input data-k="times" value="'+esc(c.times)+'" placeholder="06:00,12:00"></div><div class="control" data-interval="'+id+'"><label>每隔多少分钟</label><input data-k="interval_minutes" type="number" min="1" value="'+(c.interval_minutes||"")+'"></div></div><div class="settingfoot"><label class="check"><input type="checkbox" data-k="tg_enabled" '+(c.tg_enabled?"checked":"")+'> '+tg+'</label><span class="sub">默认由你自己决定是否开启</span></div></div>'}
function scheduleFields(id){var card=document.querySelector('[data-model="'+id+'"]'),v=card.querySelector('[data-k="schedule_type"]').value;card.querySelector('[data-time="'+id+'"]').style.display=v==="times"?"flex":"none";card.querySelector('[data-interval="'+id+'"]').style.display=v==="interval"?"flex":"none"}
function renderSettings(){if(!data)return;el("settingModels").innerHTML=["m1","mr1","m3","m4"].map(control).join("");["m1","mr1","m3","m4"].forEach(scheduleFields);
var fields={TOTALCORNER_TOKEN:"赛事数据",M1_TELEGRAM_BOT_TOKEN:"M1 TG 机器人",M1_TELEGRAM_CHAT_ID:"M1 TG 接收位置",MR1_TG_BOT_TOKEN:"MR1 TG 机器人",MR1_TG_CHAT_ID:"MR1 TG 接收位置",RESEARCH_TG_BOT_TOKEN:"M3/M4 TG 机器人",RESEARCH_TG_CHAT_ID:"M3/M4 TG 接收位置"};
el("credStatus").innerHTML='<div style="padding:12px 0">'+Object.keys(fields).map(function(k){return '<div class="credline"><b>'+fields[k]+'</b><span>'+(data.credentials[k]?"已保存":"未设置")+'</span></div>'}).join("")+'</div>'}
async function post(url,payload){var r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json","X-CSRF-Token":data.csrf},body:JSON.stringify(payload)});var x=await r.json();if(!r.ok)throw Error(x.error||"操作失败");return x}
async function refresh(show){try{var r=await fetch("/api/status",{cache:"no-store"});data=await r.json();if(currentTab==="scores")renderScores();if(currentTab==="runs")renderRuns();if(currentTab==="settings"&&(show||!document.activeElement.matches("input,select")))renderSettings();if(show)toast("已读取最新本机账本")}catch(err){toast("本机连接失败："+err.message,true)}}
async function runModel(id,action){try{await post("/api/run",{model:id,action:action});toast(modelNames[id]+" 任务已启动");tab("runs");await refresh(false)}catch(err){toast(err.message,true)}}
async function saveModel(id){try{var x=document.querySelector('[data-model="'+id+'"]'),k=function(name){return x.querySelector('[data-k="'+name+'"]')};var patch={schedule_enabled:k("schedule_enabled").checked,schedule_type:k("schedule_type").value,times:k("times").value,interval_minutes:Number(k("interval_minutes").value||0),tg_enabled:k("tg_enabled").checked};await post("/api/settings",{models:{[id]:patch}});toast(modelNames[id]+" 设置已保存");await refresh(false)}catch(err){toast(err.message,true)}}
async function saveCredential(){var k=el("credKey").value,v=el("credValue").value;if(!v.trim())return toast("请先填写",true);try{await post("/api/credentials",{key:k,value:v});el("credValue").value="";toast("已保存到 Mac 本机");await refresh(false)}catch(err){toast(err.message,true)}}
async function loadLog(id){try{var r=await fetch("/api/logs?id="+encodeURIComponent(id)),x=await r.json();var target=el("raw-"+id);if(target){target.innerHTML="";var pre=document.createElement("pre");pre.textContent=x.log||"没有原始记录";target.appendChild(pre)}}catch(err){toast(err.message,true)}}
refresh(false);setInterval(function(){if(currentTab!=="settings")refresh(false)},10000);
</script><script src="/orders.js"></script></body></html>
