name: M3 TotalCorner Crown Live Quote Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install encrypted research collector dependency
        run: python -m pip install --disable-pip-version-check cryptography
      - name: Collect M3-only historical Crown AH and OU paths and encrypt on runner
        env:
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
          M3_CROWN_RESEARCH_KEY: ${{ secrets.M3_CROWN_RESEARCH_KEY }}
        run: python research/m3/collect_crown_drop_research.py
      - name: Upload encrypted data only
        uses: actions/upload-artifact@v4
        with:
          name: m3-crown-encrypted-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-crown-research/m3_crown_research.bin
          retention-days: 1
          if-no-files-found: error
      - name: Publish value-free research counts
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/m3-crown-research/public_summary.json" ]; then
            cat "$RUNNER_TEMP/m3-crown-research/public_summary.json" >> "$GITHUB_STEP_SUMMARY"
          fi
