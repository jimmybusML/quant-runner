name: M3 TotalCorner Crown AH OU Research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manifest_league:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        league: [E0, D1, F1, I1, SP1, B1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install encryption dependency
        run: python -m pip install --disable-pip-version-check cryptography
      - name: Match strict OOS M3 fixtures to this scoped league and encrypt
        env:
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
          M3_CROWN_RESEARCH_KEY: ${{ secrets.M3_CROWN_RESEARCH_KEY }}
        run: python research/m3/collect_crown_drop_batched.py --stage manifest-league --league '${{ matrix.league }}'
      - uses: actions/upload-artifact@v4
        with:
          name: m3-crown-manifest-${{ github.run_id }}-${{ matrix.league }}
          path: ${{ runner.temp }}/m3-crown-research/m3_crown_manifest_league_${{ matrix.league }}.bin
          retention-days: 1
          if-no-files-found: error
      - name: Publish value free manifest counts
        if: always()
        run: |
          SUMMARY="$RUNNER_TEMP/m3-crown-research/manifest_league_${{ matrix.league }}_summary.json"
          if [ -f "$SUMMARY" ]; then cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"; fi

  manifest:
    needs: manifest_league
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install encryption dependency
        run: python -m pip install --disable-pip-version-check cryptography
      - uses: actions/download-artifact@v4
        with:
          pattern: m3-crown-manifest-${{ github.run_id }}-*
          path: ${{ runner.temp }}/m3-crown-research/leagues
          merge-multiple: true
      - name: Merge encrypted league manifests and deduplicate match IDs
        env:
          M3_CROWN_RESEARCH_KEY: ${{ secrets.M3_CROWN_RESEARCH_KEY }}
        run: python research/m3/collect_crown_drop_batched.py --stage merge-leagues --input-dir "$RUNNER_TEMP/m3-crown-research/leagues"
      - uses: actions/upload-artifact@v4
        with:
          name: m3-crown-manifest-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-crown-research/m3_crown_manifest.bin
          retention-days: 1
          if-no-files-found: error
      - name: Publish unified manifest counts
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/m3-crown-research/manifest_summary.json" ]; then
            cat "$RUNNER_TEMP/m3-crown-research/manifest_summary.json" >> "$GITHUB_STEP_SUMMARY"
          fi

  crown_quotes:
    needs: manifest
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        league: [E0, D1, F1, I1, SP1, B1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install encryption dependency
        run: python -m pip install --disable-pip-version-check cryptography
      - uses: actions/download-artifact@v4
        with:
          name: m3-crown-manifest-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-crown-research
      - name: Collect Crown AH and OU quote paths for this league
        env:
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
          M3_CROWN_RESEARCH_KEY: ${{ secrets.M3_CROWN_RESEARCH_KEY }}
          M3_CROWN_MANIFEST: ${{ runner.temp }}/m3-crown-research/m3_crown_manifest.bin
        run: python research/m3/collect_crown_drop_batched.py --stage quotes-league --league '${{ matrix.league }}'
      - uses: actions/upload-artifact@v4
        with:
          name: m3-crown-quotes-${{ github.run_id }}-${{ matrix.league }}
          path: ${{ runner.temp }}/m3-crown-research/m3_crown_quotes_league_${{ matrix.league }}.bin
          retention-days: 1
          if-no-files-found: error
      - name: Publish value free Crown quote counts
        if: always()
        run: |
          SUMMARY="$RUNNER_TEMP/m3-crown-research/quotes_league_${{ matrix.league }}_summary.json"
          if [ -f "$SUMMARY" ]; then cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"; fi
