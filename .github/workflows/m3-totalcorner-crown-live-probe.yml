name: M3 TotalCorner Crown AH OU Research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  page_plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      chunks: ${{ steps.pages.outputs.chunks }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install encryption dependency
        run: python -m pip install --disable-pip-version-check cryptography
      - id: pages
        name: Read scoped league schedule page totals
        env:
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
        run: |
          python research/m3/collect_crown_drop_batched.py --stage league-page-chunks > "$RUNNER_TEMP/page_plan.txt"
          cat "$RUNNER_TEMP/page_plan.txt" >> "$GITHUB_OUTPUT"

  manifest_chunks:
    needs: page_plan
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        chunk: ${{ fromJson(needs.page_plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install encryption dependency
        run: python -m pip install --disable-pip-version-check cryptography
      - name: Collect one scoped schedule page range and encrypt it
        env:
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
          M3_CROWN_RESEARCH_KEY: ${{ secrets.M3_CROWN_RESEARCH_KEY }}
        run: python research/m3/collect_crown_drop_batched.py --stage manifest-league-range --league '${{ matrix.chunk.league }}' --page-start ${{ matrix.chunk.start }} --page-end ${{ matrix.chunk.end }}
      - uses: actions/upload-artifact@v4
        with:
          name: m3-crown-manifest-chunk-${{ github.run_id }}-${{ matrix.chunk.part }}
          path: ${{ runner.temp }}/m3-crown-research/m3_crown_manifest_chunk_${{ matrix.chunk.part }}.bin
          retention-days: 1
          if-no-files-found: error
      - name: Publish value free chunk counts
        if: always()
        run: |
          SUMMARY="$RUNNER_TEMP/m3-crown-research/manifest_chunk_${{ matrix.chunk.part }}_summary.json"
          if [ -f "$SUMMARY" ]; then cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"; fi

  manifest:
    needs: manifest_chunks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install encryption dependency
        run: python -m pip install --disable-pip-version-check cryptography
      - uses: actions/download-artifact@v4
        with:
          pattern: m3-crown-manifest-chunk-${{ github.run_id }}-*
          path: ${{ runner.temp }}/m3-crown-research/chunks
          merge-multiple: true
      - name: Merge encrypted page chunks and deduplicate exact TotalCorner match IDs
        env:
          M3_CROWN_RESEARCH_KEY: ${{ secrets.M3_CROWN_RESEARCH_KEY }}
        run: python research/m3/collect_crown_drop_batched.py --stage merge-league-chunks --input-dir "$RUNNER_TEMP/m3-crown-research/chunks"
      - uses: actions/upload-artifact@v4
        with:
          name: m3-crown-manifest-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-crown-research/m3_crown_manifest.bin
          retention-days: 1
          if-no-files-found: error
      - name: Publish unified manifest counts
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/m3-crown-research/manifest_summary.json" ]; then
            cat "$RUNNER_TEMP/m3-crown-research/manifest_summary.json" >> "$GITHUB_STEP_SUMMARY"
          fi

  crown_quotes:
    needs: manifest
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        league: [E0, D1, F1, I1, SP1, B1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install encryption dependency
        run: python -m pip install --disable-pip-version-check cryptography
      - uses: actions/download-artifact@v4
        with:
          name: m3-crown-manifest-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-crown-research
      - name: Collect Crown AH and OU quote paths for this league
        env:
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
          M3_CROWN_RESEARCH_KEY: ${{ secrets.M3_CROWN_RESEARCH_KEY }}
          M3_CROWN_MANIFEST: ${{ runner.temp }}/m3-crown-research/m3_crown_manifest.bin
        run: python research/m3/collect_crown_drop_batched.py --stage quotes-league --league '${{ matrix.league }}'
      - uses: actions/upload-artifact@v4
        with:
          name: m3-crown-quotes-${{ github.run_id }}-${{ matrix.league }}
          path: ${{ runner.temp }}/m3-crown-research/m3_crown_quotes_league_${{ matrix.league }}.bin
          retention-days: 1
          if-no-files-found: error
      - name: Publish value free Crown quote counts
        if: always()
        run: |
          SUMMARY="$RUNNER_TEMP/m3-crown-research/quotes_league_${{ matrix.league }}_summary.json"
          if [ -f "$SUMMARY" ]; then cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"; fi
