name: Shared MR1-scoped history collection
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shared-scoped-history-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect scoped historical fixtures
        env:
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
          TARGET_UNIQUE_MATCHES: '10000'
          MAX_REQUESTS_PER_RUN: '350'
        run: python research/shared_history/collect_scoped_history.py
      - name: Persist public shared research history
        run: |
          git config user.name "shared-research-history"
          git config user.email "actions@users.noreply.github.com"
          git add research/shared_history/totalcorner/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Persist scoped TotalCorner history [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-history-summary
          path: research/shared_history/totalcorner/latest_collection_summary.json
