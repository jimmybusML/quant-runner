          assert receipt["paired_fixture_markets"] == 145
          expected = {"AH": {"Crown": 52, "TotalCorner_default": 24},
                      "OU": {"Crown": 39, "TotalCorner_default": 30}}
          for market, sources in expected.items():
              result = receipt["markets"][market]
              assert result["unique_fixture_markets"] == sum(sources.values())
              assert result["source_fixture_markets"] == sources
              assert result["settled_fixture_markets"] == 0
              assert result["fixture_markets_pending_settlement_verification"] == sum(sources.values())
              assert result["net_units"] is None and result["roi_pct"] is None
              settled = receipt["settlement"]["markets"][market]
              assert settled["simulated_bets"] == settled["pending_bets"] == sum(sources.values())
              assert settled["settled_bets"] == 0 and settled["roi_pct"] is None
              assert settled["paired_source_fixture_markets"] == sources
              assert sum(settled["settlement_counts"].values()) == 0
          assert receipt["settlement"]["fixture_count"] == 87
          assert receipt["settlement"]["pending_fixture_markets"] == 145
          assert receipt["settlement"]["settled_fixture_markets"] == 0
          assert receipt["integrity"] == {
              "all_fixture_markets_unique": True,
              "private_fixture_level_data_published": False,
              "settlement_performed": True,
              "source_separated": True,
              "train_end_before_asof_before_or_at_quote_before_or_at_receipt_before_kickoff": True}
          serialized = json.dumps(receipt)
          for value in ('"match_id"', '"home"', '"away"', '"line"', '"prices"',
