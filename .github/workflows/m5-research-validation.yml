name: M5 Research Validation

on:
  push:
    paths:
      - "research/m5/**"
      - ".github/workflows/m5-research-validation.yml"
  pull_request:
    paths:
      - "research/m5/**"
      - ".github/workflows/m5-research-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m5-research-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned research dependencies
        run: python -m pip install numpy scipy pandas pytest penaltyblog==1.13.1
      - name: Run all M5 research tests
        run: PYTHONPATH=. python -m pytest research/m5 -q
      - name: Validate the 2026-11-08 canonical Crown live capture receipt
        run: |
          python - <<'PY'
          import hashlib, json, math, re
          from pathlib import Path

          report = json.loads(Path("research/m5/results/m5_canonical_crown_live_capture_20261108.json").read_text())
          adapter = Path("research/m5/m5_canonical_crown_capture_index.py")
          assert report["protocol"] == "M5_CANONICAL_CROWN_LIVE_CAPTURE_AND_SETTLEMENT_V1"
          assert report["adapter_sha256"] == hashlib.sha256(adapter.read_bytes()).hexdigest()
          for key in ("forecast_sha256", "canonical_collector_sha256", "adapter_sha256",
                      "capture_index_sha256", "totalcorner_fallback_index_sha256",
                      "paired_rows_sha256", "settlement_input_sha256"):
              assert re.fullmatch(r"[0-9a-f]{64}", report[key])
          capture = report["capture"]
          assert capture["capture_mode"] == "live" and capture["source"] == "Crown"
          assert capture["fixture_requests"] == capture["live_responses_recorded"] == 162
          assert capture["actual_prospective_capture_flags_total"] == 162
          assert capture["verified_live_fixture_responses"] == 85
          assert capture["eligible_post_asof_premarket_fixture_markets"] == {"AH": 83, "OU": 82}
          assert capture["failed_attempts"] == 0
          pairing = report["pairing"]
          assert pairing["unique_fixture_markets"] == 200 and pairing["unique_fixtures"] == 105
          assert pairing["time_order_passed"] and pairing["deduplication_passed"]
          assert pairing["fixture_markets_by_market"] == {"AH": 102, "OU": 98}
          assert pairing["source_fixture_markets_by_market"] == {
              "AH": {"Crown": 83, "TotalCorner_default": 19},
              "OU": {"Crown": 82, "TotalCorner_default": 16}}
          for market in ("AH", "OU"):
              result = report["markets"][market]
              assert result["simulated_bets"] == result["unique_fixture_markets"]
              assert result["settled_bets"] + result["pending_bets"] == result["simulated_bets"]
              assert sum(result["settlement_counts"].values()) == result["settled_bets"]
              assert abs(result["roi_pct_on_settled_stake"] -
                         100 * result["net_units_on_settled_bets"] / result["settled_stake_units"]) < 1e-6
              assert result["roi_pct_full_cohort"] is None
          assert report["interpretation"]["roi_goal_3pct_reached"] is False
          serialized = json.dumps(report)
          for forbidden in ('"match_id"', '"prices":', '"home_goals"', '"away_goals"',
                            '"score_grid"', '"/Users/mac/', '"/private/tmp/'):
              assert forbidden not in serialized
          print("M5 canonical Crown live receipt integrity: PASS")
          PY
      - name: Validate canonical Crown historical 10k OOS replay
        run: |
          python - <<'PY'
          import hashlib, json, math, re
          from pathlib import Path

          report = json.loads(Path("research/m5/results/m5_canonical_crown_summary_replay_20261108.json").read_text())
          runner = Path("research/m5/m5_canonical_crown_summary_replay.py")
          assert report["protocol"] == "M5_CANONICAL_CROWN_SUMMARY_EVENT_TIME_OOS_REPLAY_V1"
          assert report["runner_sha256"] == hashlib.sha256(runner.read_bytes()).hexdigest()
          for key in ("runner_sha256", "forecast_sha256", "candidate_manifest_sha256", "response_hash_set_sha256"):
              assert re.fullmatch(r"[0-9a-f]{64}", report[key])
          assert report["canonical_capture_fixtures"] == report["forecasts_joined_to_capture_ids"] == 11582
          assert report["training_test_fixture_id_overlap"] == 0
          assert report["integrity"] == {
              "actual_response_time_separate_from_quote_event_time": True,
              "fixture_identity_score_and_utc_kickoff_verified": True,
              "private_fixture_level_rows_published": False,
              "quote_event_at_or_after_asof_and_before_kickoff": True,
              "time_order_passed": True,
              "training_end_before_prediction_asof_before_kickoff": True,
              "unique_fixture_markets": True}
          expected_n = {"AH": 10400, "OU": 10399}
          for market, n in expected_n.items():
              result = report["markets"][market]
              assert result["unique_fixture_markets"] == result["simulated_bets"] == result["settled_bets"] == n
              assert result["pending_bets"] == 0 and result["stake_units"] == n
              assert result["quote_source_fixture_markets"] == {"Crown": n}
              assert result["actual_response_receipt_timing"] == {"post_kickoff": n}
              assert sum(result["settlement_counts"].values()) == n
              assert abs(result["roi_pct"] - 100 * result["net_units"] / n) < 1e-6
              assert sum(result["selected_quote_kinds"].values()) == n
              assert sum(row["fixtures"] for row in result["by_utc_kickoff_year"].values()) == n
              assert result["roi_bootstrap_95pct"]["upper_95_roi_pct"] < 0
          assert report["research_objective"] == {
              "minimum_fixture_markets_per_market": 10000,
              "sample_target_reached": {"AH": True, "OU": True},
              "roi_3pct_reached": {"AH": False, "OU": False},
              "executable_roi_demonstrated": False}
          serialized = json.dumps(report)
          for forbidden in ('"match_id"', '"prices"', '"score_grid"', '"home_goals"',
                            '"away_goals"', '"/Users/mac/', '"/private/tmp/'):
              assert forbidden not in serialized
          print("M5 canonical Crown historical OOS replay integrity: PASS")
          PY
      - name: Validate M1 MR1 M3 M4 matched canonical Crown comparison
        run: |
          python - <<'PY'
          import hashlib, json, re
          from pathlib import Path

          report_path = Path("research/m5/results/m5_model_family_canonical_crown_comparison_20261108.json")
          runner_path = Path("research/m5/m5_model_family_canonical_crown_comparison.py")
          report = json.loads(report_path.read_text())
          assert report["protocol"] == "M5_MODEL_FAMILY_CANONICAL_CROWN_MATCHED_COMPARISON_V1"
          assert report["data"]["runner_sha256"] == hashlib.sha256(runner_path.read_bytes()).hexdigest()
          assert report["data"]["crown_fixture_markets_by_market"] == {"AH": 10400, "OU": 10399}
          for key in ("runner_sha256", "crown_input_sha256", "m1_trace_sha256", "mr1_trace_sha256", "m3_grid_archive_sha256"):
              assert re.fullmatch(r"[0-9a-f]{64}", report["data"][key])
          for market in ("AH", "OU"):
              result = report["markets"][market]
              assert result["canonical_cohort_n"] == report["data"]["crown_fixture_markets_by_market"][market]
              common = result["same_fixture_common_cohort"]
              n = common["unique_fixture_markets"]
              assert n > 0 and all(model["simulated_bets"] == n for model in common["models"].values())
              for name, model in result.items():
                  if not isinstance(model, dict) or "simulated_bets" not in model:
                      continue
                  assert model["simulated_bets"] == model["settled_bets"]
                  assert sum(model["settlement_counts"].values()) == model["settled_bets"]
                  assert abs(model["roi_pct"] - 100 * model["net_units"] / model["stake_units"]) < 1e-6
                  assert model["quote_sources"] == {"Crown": model["simulated_bets"]}
                  assert model["receipt_timing"] == {"post_kickoff": model["simulated_bets"]}
              assert result["M1"]["simulated_bets"] < result["canonical_cohort_n"]
              assert result["MR1_V6"]["simulated_bets"] < result["canonical_cohort_n"]
          serialized = json.dumps(report)
          for forbidden in ('"fixture_id"', '"prices"', '"score_grid"', '"home_goals"', '"away_goals"', '"/private/tmp/'):
              assert forbidden not in serialized
          print("M5 model-family canonical Crown comparison integrity: PASS")
          PY
      - name: Validate annual-refit penaltyblog Crown OOS report
        run: |
          python - <<'PY'
          import hashlib, json, re
          from pathlib import Path

          path = Path("research/m5/results/m5_canonical_crown_penaltyblog_refit_20261109.json")
          runner = Path("research/m5/m5_canonical_crown_penaltyblog_refit.py")
          report = json.loads(path.read_text())
          assert report["protocol"] == "M5_CANONICAL_CROWN_PENALTYBLOG_ANNUAL_WALK_FORWARD_OOS_V1"
          assert report["runner_sha256"] == hashlib.sha256(runner.read_bytes()).hexdigest()
          for value in (report["runner_sha256"], *report["inputs"].values()):
              assert re.fullmatch(r"[0-9a-f]{64}", value)
          assert report["canonical_crown_fixture_markets_by_market"] == {"AH": 10400, "OU": 10399}
          assert report["unique_target_fixtures"] == 10400
          assert report["three_model_predictions_with_league_average_unseen_team_fallback"] == 10400
          assert report["complete_three_model_oos_fixture_predictions"] == 9591
          assert report["fold_count"] == 91 and report["target_utc_years"] == [2025, 2026]
          assert report["time_order_passed"] is True and report["training_test_fixture_ids_disjoint"] is True
          assert report["fixture_level_rows_published"] is False
          assert report["quote_source"] == "Crown only; no TotalCorner substitution."
          for market, expected in (("AH", 10400), ("OU", 10399)):
              for name, model in report["markets"][market].items():
                  n = expected if name.endswith("LeagueAvgFallback") else (9591 if market == "AH" else 9590)
                  assert model["simulated_bets"] == model["settled_bets"] == n
                  assert sum(model["settlement_counts"].values()) == n
                  assert abs(model["roi_pct"] - 100 * model["net_units"] / n) < 1e-6
                  assert model["quote_sources"] == {"Crown": n}
                  assert model["response_receipt_timing"] == {"post_kickoff": n}
                  assert model["bootstrap_95_roi_pct"]["upper"] < 0
          serialized = json.dumps(report)
          for forbidden in ('"fixture_id"', '"prices"', '"grids"', '"home_goals"', '"away_goals"', '"/private/tmp/'):
              assert forbidden not in serialized
          print("M5 annual-refit penaltyblog Crown OOS integrity: PASS")
          PY
      - name: Validate the public joint-model receipt
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          code = Path("research/m5/m5_joint_market_1x2_residual_scoregrid.py")
          receipt = json.loads(Path("research/m5/results/m5_joint_market_1x2_residual_2025fit_2026holdout_20261106.json").read_text())
          assert receipt["runner_sha256"] == hashlib.sha256(code.read_bytes()).hexdigest()
          for market, result in receipt["markets"].items():
              assert market in {"AH", "OU"}
              assert result["training_and_holdout_fixture_ids_disjoint"] is True
              n = result["holdout_fixture_markets"]
              assert n >= 10_000
              assert result["holdout_quote_receipt_timing"] == {"post_kickoff": n}
              assert sum(result["holdout_source_counts"].values()) == n
              for model in result["2026_holdout"].values():
                  assert model["simulated_bets"] == model["settled_bets"] == n
                  assert sum(model["settlement_counts"].values()) == n
                  assert abs(model["roi_pct"] - 100 * model["net_units"] / model["stake_units"]) < 1e-6
          print("M5 public receipt integrity: PASS")
          PY
      - name: Validate the public M1 archive re-audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("research/m5/results/m5_m1_expanded_archive_reaudit_20261106.json").read_text())
          assert report["archived_scan_count"] == 203
          for market in ("AH", "OU"):
              result = report["markets"][market]["latest_saved_model_output_per_fixture"]
              assert result["fixtures"] == 1233
              assert result["fixtures"] < report["audit_counts"][f"valid_model_output_{market}"]
              assert abs(result["roi_pct"] - 100 * result["net_units"] / result["fixtures"]) < 1e-6
          serialized = json.dumps(report)
          assert '"match_id"' not in serialized and '"prices":' not in serialized and '"teams"' not in serialized
          print("M5 M1 archive re-audit integrity: PASS")
          PY
      - name: Validate the public forward quote refresh comparison
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("research/m5/results/m5_forward_shadow_refresh_20261106T1417Z.json").read_text())
          assert report["refresh_target_fixtures"] == report["refresh_targets_matching_frozen_forecast"]
          assert report["capture_attempted_fixtures"] == report["capture_aggregate_counts"]["verified_fixture_responses"] + report["capture_aggregate_counts"]["identity_or_api_failure"] + report["capture_aggregate_counts"]["transport_errors"]
          assert report["added_fixture_markets"] == report["removed_fixture_markets"] == 0
          assert report["new_unique_fixture_markets"] == sum(report["new_fixture_markets_by_market"].values())
          assert report["roi_pct"] is None
          assert report["changed_quote_fields_on_common_fixture_markets"]["odds_pair_changed"] > 0
          serialized = json.dumps(report)
          for field in ('"match_id"', '"prices":', '"line":', '"home":', '"away":'):
              assert field not in serialized
          print("M5 forward refresh comparison integrity: PASS")
          PY
      - name: Validate the public MR1-M3 temporal blend receipt
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          runner = Path("research/m5/m5_mr1_m3_temporal_probability_blend.py")
          report = json.loads(Path("research/m5/results/m5_mr1_m3_2025fit_2026holdout_blend_20261106.json").read_text())
          assert report["runner_sha256"] == hashlib.sha256(runner.read_bytes()).hexdigest()
          assert report["common_fixture_count"] == 9517
          assert report["audit"] == {"m3_post_kickoff_receipts": 19034, "mr1_post_kickoff_receipts": 19034, "pre_kickoff_event_quotes": 19034}
          for market in ("AH", "OU"):
              result = report["markets"][market]
              assert result["train_fixture_markets"] == 1005
              assert result["holdout_fixture_markets"] == 8512
              assert result["train_test_fixture_ids_disjoint"] is True
              for model in result["models"].values():
                  test = model["holdout_2026"]
                  assert test["simulated_bets"] == test["settled_bets"] == 8512
                  assert sum(test["settlement_counts"].values()) == 8512
                  assert abs(test["roi_pct"] - 100 * test["net_units"] / test["stake_units"]) < 1e-6
          serialized = json.dumps(report)
          for field in ('"match_id"', '"prices":', '"home_goals"', '"away_goals"'):
              assert field not in serialized
          print("M5 MR1-M3 temporal blend integrity: PASS")
          PY
      - name: Validate the MR1-M3 full M3-quoted cohort receipt
        run: |
          python - <<'PY'
          import hashlib, json, math
          from pathlib import Path

          runner = Path("research/m5/m5_mr1_m3_source_union_blend.py")
          receipt = json.loads(Path("research/m5/results/m5_mr1_m3_source_union_blend_20261106.json").read_text())
          assert receipt["runner_sha256"] == hashlib.sha256(runner.read_bytes()).hexdigest()
          assert receipt["time_order_passed"] is True
          assert receipt["AH_OU_fixture_id_sets_equal"] is True
          assert receipt["blend_weight_mr1"] == 0.5
          assert "not a fresh untouched holdout" in receipt["candidate_status"]
          for market in ("AH", "OU"):
              result = receipt["markets"][market]
              n = result["unique_m3_quoted_fixtures"]
              assert n == 10568
              assert result["mr1_exact_quote_fixture_markets"] == 9517
              assert result["m3_fallback_fixture_markets"] == n - 9517
              assert sum(result["quote_sources"].values()) == n
              for model, strategies in result["models"].items():
                  assert model in {"poisson", "dixon_coles", "bivariate_poisson", "m3_equal_ensemble"}
                  assert set(strategies) == {"M3_only", "MR1_M3_fixed_blend_with_M3_fallback"}
                  for entry in strategies.values():
                      overall = entry["all_years"]
                      assert overall["unique_fixture_markets"] == overall["simulated_bets"] == overall["settled_bets"] == n
                      assert sum(overall["settlement_counts"].values()) == n
                      assert abs(overall["roi_pct"] - 100 * overall["net_units"] / overall["stake_units"]) < 1e-6
                      assert overall["response_receipt_timing"] == {"post_kickoff": n}
                      yearly = entry["by_utc_kickoff_year"]
                      assert set(yearly) == {"2025", "2026"}
                      assert sum(x["settled_bets"] for x in yearly.values()) == n
                      assert math.isclose(sum(x["net_units"] for x in yearly.values()), overall["net_units"], abs_tol=1e-5)
          serialized = json.dumps(receipt)
          for field in ('"match_id"', '"prices":', '"home_goals"', '"away_goals"'):
              assert field not in serialized
          print("M5 MR1-M3 complete-cohort receipt integrity: PASS")
          PY
      - name: Validate public M1 full-cohort and common Crown comparison receipts
        run: |
          python - <<'PY'
          import hashlib, json, math
          from pathlib import Path

          m1_runner = Path("research/m5/m5_m1_full_cohort_replay.py")
          m1 = json.loads(Path("research/m5/results/m5_m1_full_cohort_oos_20261106.json").read_text())
          assert m1["runner_sha256"] == hashlib.sha256(m1_runner.read_bytes()).hexdigest()
          assert m1["cohort_unique_fixtures_with_m1_predictions"] == 10568
          assert m1["fold_count"] == 93
          assert m1["audit_counts"] == {}
          assert m1["m1_calibration_cutoff_exclusive"] == "2024-06-01"
          assert m1["m1_static_shrinkage_prior_fit_before"] == "2023-11-01T00:00:00+00:00"
          for market, sources in (("AH", {"Crown": 9613, "TotalCorner_default": 955}),
                                  ("OU", {"Crown": 9612, "TotalCorner_default": 956})):
              result = m1["markets"][market]["all_years"]
              assert result["unique_fixtures"] == result["simulated_bets"] == result["settled_bets"] == 10568
              assert result["quote_sources"] == sources
              assert result["response_receipt_timing"] == {"post_kickoff": 10568}
              assert sum(result["settlement_counts"].values()) == 10568
              assert abs(result["roi_pct"] - 100 * result["net_units"] / result["stake_units"]) < 1e-6
              assert result["roi_bootstrap_95pct"]["upper_95_roi_pct"] < 0
              for year in ("2025", "2026"):
                  assert m1["markets"][market]["by_utc_kickoff_year"][year]["settled_bets"] > 0
          m1_text = json.dumps(m1)
          for field in ('"match_id"', '"prices":', '"home_goals"', '"away_goals"', '"/Users/mac/'):
              assert field not in m1_text

          comparison_runner = Path("research/m5/m5_mr1_m1_m3_same_crown_cohort.py")
          comparison = json.loads(Path("research/m5/results/m5_mr1_m1_m3_same_crown_cohort_20261106.json").read_text())
          assert comparison["runner_sha256"] == hashlib.sha256(comparison_runner.read_bytes()).hexdigest()
          assert comparison["audit_counts"] == {}
          assert comparison["provider_receipt_timing"] == {"post_kickoff": 19034}
          model_names = {"m1", "mr1_v6", "m3_poisson", "m3_dixon_coles", "m3_bivariate_poisson"}
          for market in ("AH", "OU"):
              result = comparison["markets"][market]
              assert result["shared_unique_fixtures"] == result["exact_shared_quote_contracts"] == 9517
              assert result["quote_sources"] == {"Crown": 9517}
              assert set(result["models"]) == model_names
              for model in result["models"].values():
                  assert model["unique_fixtures"] == model["simulated_bets"] == model["settled_bets"] == 9517
                  assert model["quote_sources"] == {"Crown": 9517}
                  assert sum(model["settlement_counts"].values()) == 9517
                  assert abs(model["roi_pct"] - 100 * model["net_units"] / model["stake_units"]) < 1e-6
                  assert 0 <= model["settlement_brier"] <= 2 and math.isfinite(model["settlement_log_loss"])
          comparison_text = json.dumps(comparison)
          for field in ('"match_id"', '"prices":', '"home_goals"', '"away_goals"', '"/Users/mac/'):
              assert field not in comparison_text
          print("M5 M1 full-cohort and exact Crown comparison integrity: PASS")
          PY
      - name: Validate the public M1-MR1-M3 learned blend receipt
        run: |
          python - <<'PY'
          import hashlib, json, math
          from pathlib import Path

          runner = Path("research/m5/m5_m1_mr1_m3_learned_blend_oos.py")
          report = json.loads(Path("research/m5/results/m5_m1_mr1_m3_learned_blend_20261106.json").read_text())
          assert report["runner_sha256"] == hashlib.sha256(runner.read_bytes()).hexdigest()
          assert report["common_unique_fixtures_per_market"] == 9517
          assert report["audit_counts"] == {}
          for market in ("AH", "OU"):
              result = report["markets"][market]
              assert result["training_fixture_markets_2025"] == 1005
              assert result["holdout_fixture_markets_2026"] == 8512
              assert result["training_test_fixture_ids_disjoint"] is True
              for model_name in ("learned_weights", "roi_learned_weights"):
                  weights = result[model_name]
