name: M5 Research Validation

on:
  push:
    paths:
      - "research/m5/**"
      - ".github/workflows/m5-research-validation.yml"
  pull_request:
    paths:
      - "research/m5/**"
      - ".github/workflows/m5-research-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m5-research-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned research dependencies
        run: python -m pip install numpy scipy pandas pytest penaltyblog==1.13.1
      - name: Run all M5 research tests
        run: PYTHONPATH=. python -m pytest research/m5 -q
      - name: Validate the public joint-model receipt
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          code = Path("research/m5/m5_joint_market_1x2_residual_scoregrid.py")
          receipt = json.loads(Path("research/m5/results/m5_joint_market_1x2_residual_2025fit_2026holdout_20261106.json").read_text())
          assert receipt["runner_sha256"] == hashlib.sha256(code.read_bytes()).hexdigest()
          for market, result in receipt["markets"].items():
              assert market in {"AH", "OU"}
              assert result["training_and_holdout_fixture_ids_disjoint"] is True
              n = result["holdout_fixture_markets"]
              assert n >= 10_000
              assert result["holdout_quote_receipt_timing"] == {"post_kickoff": n}
              assert sum(result["holdout_source_counts"].values()) == n
              for model in result["2026_holdout"].values():
                  assert model["simulated_bets"] == model["settled_bets"] == n
                  assert sum(model["settlement_counts"].values()) == n
                  assert abs(model["roi_pct"] - 100 * model["net_units"] / model["stake_units"]) < 1e-6
          print("M5 public receipt integrity: PASS")
          PY
      - name: Validate the public forward pairing receipt
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          code = Path("research/m5/m5_forward_shadow_public_receipt.py")
          report = json.loads(Path("research/m5/results/m5_forward_shadow_refresh_20261106T1336Z.json").read_text())
          assert report["sanitizer_sha256"] == hashlib.sha256(code.read_bytes()).hexdigest()
          assert report["integrity"]["all_fixture_markets_unique"] is True
          assert report["integrity"]["source_separated"] is True
          assert report["integrity"]["private_fixture_level_data_published"] is False
          for market in ("AH", "OU"):
              result = report["markets"][market]
              assert result["unique_fixture_markets"] == report["paired_fixture_markets_by_market"][market]
              assert sum(result["source_fixture_markets"].values()) == result["unique_fixture_markets"]
              assert result["settled_fixture_markets"] == 0
              assert result["net_units"] is None and result["roi_pct"] is None
          serialized = json.dumps(report)
          assert '"match_id"' not in serialized and '"prices":' not in serialized
          print("M5 forward pairing receipt integrity: PASS")
          PY
      - name: Validate the public forward settlement receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          pair = json.loads(Path("research/m5/results/m5_forward_shadow_refresh_20261106T1336Z.json").read_text())
          for receipt_path in sorted(Path("research/m5/results").glob("m5_forward_shadow_settlement_*.json")):
              report = json.loads(receipt_path.read_text())
              assert report["paired_input_sha256"] == pair["pair_sha256"]
              assert report["settled_fixture_markets"] + report["pending_fixture_markets"] == report["markets"]["AH"]["simulated_bets"] + report["markets"]["OU"]["simulated_bets"]
              for market in ("AH", "OU"):
                  result = report["markets"][market]
                  assert result["unique_fixture_markets"] == result["simulated_bets"]
                  assert result["settled_bets"] + result["pending_bets"] == result["simulated_bets"]
                  assert sum(result["settlement_counts"].values()) == result["settled_bets"]
                  assert sum(result["paired_source_fixture_markets"].values()) == result["simulated_bets"]
                  assert sum(result["settled_source_fixture_markets"].values()) == result["settled_bets"]
                  if result["settled_bets"] < result["simulated_bets"]:
                      assert result["roi_pct"] is None
              serialized = json.dumps(report)
              assert '"match_id"' not in serialized and '"prices":' not in serialized
          print("M5 forward settlement receipt integrity: PASS")
          PY
